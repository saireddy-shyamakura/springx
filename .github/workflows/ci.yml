name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]   # releases run their own workflow
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  # ── Format check ──────────────────────────────────────────────────────────
  fmt:
    name: go fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

  # ── Vet ───────────────────────────────────────────────────────────────────
  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...

  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # ── Build ─────────────────────────────────────────────────────────────────
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build -v ./...

  # ── Test ──────────────────────────────────────────────────────────────────
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: >
          go test
          -count=1
          -timeout=120s
          -coverprofile=coverage.out
          ./internal/config/...
          ./internal/metadata/...
          ./internal/plugins/...
          ./internal/templates/...
          ./internal/extract/...
          ./internal/initializr/...
          ./internal/postgen/...
          ./internal/ui/...
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # ── Benchmarks (informational, Linux only) ────────────────────────────────
  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run benchmarks
        run: >
          go test -bench=. -benchmem -run='^$'
          ./internal/...
          | tee bench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: bench.txt
